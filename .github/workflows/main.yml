name: Build APK Jukebox MarcoS
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Create Android Project
        run: |
          mkdir -p app/src/main/java/com/wurlitzer/jukebox
          echo "include ':app'" > settings.gradle
          echo "buildscript{repositories{google();mavenCentral()} dependencies{classpath 'com.android.tools.build:gradle:8.2.0'}} allprojects{repositories{google();mavenCentral()}}" > build.gradle
          printf "plugins{id 'com.android.application'}\nandroid{namespace 'com.wurlitzer.jukebox'; compileSdk 34; defaultConfig{applicationId \"com.wurlitzer.jukebox\"; minSdk 21; targetSdk 34; versionCode 1; versionName \"1.0\"} buildTypes{release{minifyEnabled false}}}\ndependencies{implementation 'androidx.appcompat:appcompat:1.6.1'}\n" > app/build.gradle
          printf "<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"><application android:label=\"Jukebox MarcoS\" android:theme=\"@android:style/Theme.NoTitleBar.Fullscreen\"><activity android:name=\".MainActivity\" android:exported=\"true\"><intent-filter><action android:name=\"android.intent.action.MAIN\"/><category android:name=\"android.intent.category.LAUNCHER\"/></intent-filter></activity></application></manifest>\n" > app/src/main/AndroidManifest.xml
          printf "package com.wurlitzer.jukebox; import android.app.Activity; import android.os.Bundle; import android.webkit.WebView; public class MainActivity extends Activity { protected void onCreate(Bundle b){ super.onCreate(b); WebView w=new WebView(this); w.getSettings().setJavaScriptEnabled(true); w.loadUrl(\"https://wurlitzer-jukebox.vercel.app/?client=b01b99b43d3342b596a2711efeac4d62\"); setContentView(w); } }\n" > app/src/main/java/com/wurlitzer/jukebox/MainActivity.java
      - name: Build APK
        run: |
          gradle wrapper
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Jukebox-MarcoS-APK
          path: app/build/outputs/apk/debug/*.apk
